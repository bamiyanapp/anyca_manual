name: deploy website
on:
  push:
    branches:
      - master
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page-url }}
    steps:
      - uses: actions/checkout@v7
      - name: Deploy to GitHub Pages
        id: deploy
        uses: bamiyanapp/dev-standards/.github/actions/deploy-github-pages@v2.26.2
        with:
          working-directory: .
          node-version: "22"
          build-command: "NODE_OPTIONS=--openssl-legacy-provider npm run build"
          artifact-path: ./public
