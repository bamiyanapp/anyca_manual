name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.27.0
    with:
      # 本リポジトリはfrontend_dir/backend_dir構成のNode.jsアプリではなく、
      # lint/testスクリプトも存在しないVuePress製の静的コンテンツサイトのため、
      # frontend-test/backend-test/package-testは全て対象外にする。
      # packagesへ空配列文字列を渡すと、これらのジョブは実行されず
      # commitlint・mergeジョブのみが有効になる（reusable-ci.yml側の
      # `inputs.packages == ''`/`fromJSON(inputs.packages)[0] == null`判定を利用）
      packages: '[]'
      # コード（javascript）の丸ごと重複検知。対象はdocs/.vuepress配下のconfig.js等
      # 数ファイルのみだが、ローカルでの実行確認（0件）を踏まえ有効化する
      enable_duplication_check: true
      duplication_threshold: 1
      # Markdownドキュメント（docs/*.md・CLAUDE.md）の丸ごとコピペ重複検知
      enable_doc_duplication_check: true
      doc_duplication_threshold: 1
      doc_duplication_paths: "docs\nCLAUDE.md"
      # Markdownドキュメントの日本語文章品質チェック。共有設定
      # （textlint.config.cjs・textlint-rules/）はdev-standardsからsymlink配布
      # される想定だが、本リポジトリはsubmoduleを持たないため実体ファイルとして
      # コピーしている
      enable_text_lint: true
      text_lint_paths: "docs/*.md\nCLAUDE.md"
      # Markdown間の相対リンク切れ検知。docs/index.mdはVuePress特有のルーティング
      # （.html拡張子・ルート絶対パスの画像）を使っており、ファイルシステムベースの
      # markdown-link-checkでは実在ファイルとして解決できず誤検知するため対象から除外する
      enable_dead_link_check: true
      dead_link_check_paths: "docs/guideline.md\ndocs/i3.md\ndocs/outlander.md\ndocs/process.md\ndocs/transaction-location.md\nCLAUDE.md"
    secrets:
      # mergeジョブのsquash mergeをBOT_TOKENで行わないと、GITHUB_TOKENによる
      # マージはGitHub Actions上で新たなワークフロー実行のトリガーにならず、
      # masterへのpushイベントが発生せずgithub-pages.yml（デプロイ）が起動しない。
      # リポジトリのSettings > Secrets and variables > ActionsでBOT_TOKEN
      # （リポジトリへの書き込み権限を持つPAT）を登録すること（未設定の場合、
      # マージ自体は行われるがデプロイが自動では走らない）
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
